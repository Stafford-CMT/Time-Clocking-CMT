<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in — Time Slide</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
  :root{
    --bg: #10161f;
    --panel: #171f2b;
    --line: #263141;
    --ink: #eef2f6;
    --ink-secondary: #98a4b3;
    --accent: #4f8ec9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:2.5rem 2rem; width:100%; max-width:360px; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .logo{width:56px; height:56px; margin:0 auto .9rem; display:block;}
  h1{font-size:1.3rem; margin:0 0 .25rem;}
  p.sub{color:var(--ink-secondary); font-size:.9rem; margin:0 0 1.75rem;}
  .ms-btn{
    display:flex; align-items:center; justify-content:center; gap:.6rem;
    width:100%; padding:.75rem 1rem; border-radius:6px; border:1px solid var(--line);
    background:#fff; color:#1b1b1b; font-size:.95rem; font-weight:600;
    text-decoration:none; cursor:pointer;
  }
  .ms-btn:hover{ filter:brightness(0.97); }
  .dev-accounts{ display:none; text-align:left; }
  .dev-accounts p{ color:var(--ink-secondary); font-size:.8rem; margin:0 0 .6rem; }
  .dev-account{
    display:flex; justify-content:space-between; align-items:center; gap:.6rem;
    padding:.65rem .9rem; margin-bottom:.5rem; border-radius:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    text-decoration:none; font-size:.92rem;
  }
  .dev-account:hover{ border-color:var(--accent); }
  .dev-account span{ color:var(--ink-secondary); font-size:.8rem; text-transform:capitalize; }
  .error{
    margin-top:1.25rem; padding:.6rem .8rem; border-radius:6px;
    background:rgba(220,80,80,.15); border:1px solid rgba(220,80,80,.4);
    color:#f3b8b8; font-size:.85rem; display:none;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/favicon.svg" alt=""/>
    <h1>Time Slide</h1>
    <p class="sub">Tap to start. Slide to put it right.</p>
    <a class="ms-btn" href="/auth/login">
      <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </a>
    <div class="dev-accounts" id="devAccounts">
      <p>Development sign-in — choose who to sign in as:</p>
    </div>
    <div class="error" id="errBox">Sign-in failed or was cancelled. Please try again.</div>
  </div>
  <script>
    // Keep a link to a screen (e.g. #edit-times/2026-11-02 from a reminder email) so the app can open it after sign-in.
    if (location.hash) { try { sessionStorage.setItem('timeslide-open', location.hash); } catch (e) {} }
    const err = new URLSearchParams(window.location.search).get('error');
    if(err){
      const box = document.getElementById('errBox');
      box.textContent = err==='domain'
        ? 'This app is only available to @cliffeng.com accounts.'
        : err==='not-added'
          ? "You haven't been added to Time Slide yet. Ask a Time Slide admin to add you, then sign in again."
          : 'Sign-in failed or was cancelled. Please try again.';
      box.style.display = 'block';
    }
    // Development sign-in only: swap the Microsoft button for one per test account.
    fetch('/auth/dev-accounts').then((r) => r.json()).then(({ accounts }) => {
      if (!accounts || !accounts.length) return;
      const list = document.getElementById('devAccounts');
      accounts.forEach(({ role, name }) => {
        const link = document.createElement('a');
        link.className = 'dev-account';
        link.href = '/auth/login?as=' + encodeURIComponent(role);
        link.textContent = name;
        const tag = document.createElement('span');
        tag.textContent = role;
        link.appendChild(tag);
        list.appendChild(link);
      });
      document.querySelector('.ms-btn').style.display = 'none';
      list.style.display = 'block';
    }).catch(() => {});
  </script>
</body>
</html>
